publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: '>=3.1.3 <4.0.0'


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  go_router: ^13.0.1
  hooks_riverpod: ^2.4.5
  flutter_svg: ^2.0.9

dev_dependencies:
